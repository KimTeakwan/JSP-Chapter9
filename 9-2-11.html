<script>
  class Square {
    // #은 private, static은 클래스 멤버로 만들어주는 키워드
    #length;
    static #counter = 0; // 지금까지 생성된 Square 객체의 수를 세는 변수

    // static 메소드
    static get counter() {
      return Square.#counter;
    }

    static perimeterOf(length) {
      return length * 4;
    }

    static areaOf(length) {
      return length * length;
    }

    constructor(length) {
      this.length = length; // setter가 호출됨
      // 생성자가 호출될 때마다 카운터를 1씩 증가시킴
      Square.#counter += 1;
    }

    // 인스턴스 게터/세터 (이전과 동일)
    get length() {
      return this.#length;
    }
    set length(value) {
      if (value <= 0) {
        throw '길이는 0보다 커야 합니다.';
      }
      this.#length = value;
    }

    // 인스턴스 메소드 (이전과 동일)
    get perimeter() {
      return this.#length * 4;
    }
    get area() {
      return this.#length * this.#length;
    }
  }

  // --- 클래스 사용하기 ---
  const squareA = new Square(10);
  const squareB = new Square(20);
  const squareC = new Square(30);

  // static 속성 사용하기
  console.log(`지금까지 생성된 Square 인스턴스는 ${Square.counter}개입니다.`);

  // static 메소드 사용하기
  console.log(`한 변의 길이가 20인 정사각형의 둘레는 ${Square.perimeterOf(20)}입니다.`);
  console.log(`한 변의 길이가 30인 정사각형의 넓이는 ${Square.areaOf(30)}입니다.`);
</script>
