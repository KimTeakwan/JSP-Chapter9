<script>
  // 부모 클래스 (Parent Class)
  class Rectangle {
    constructor(width, height) {
      this.width = width;
      this.height = height;
    }

    getPerimeter() {
      return 2 * (this.width + this.height);
    }

    getArea() {
      return this.width * this.height;
    }
  }

  // 자식 클래스 (Child Class)
  // Rectangle 클래스의 기능을 그대로 물려받습니다.
  class Square extends Rectangle {
    constructor(length) {
      // super()는 부모 클래스의 생성자를 호출하는 특별한 함수입니다.
      // 정사각형은 가로와 세로가 같으므로 length를 두 번 전달합니다.
      super(length, length);
    }
  }

  // 클래스 사용하기
  const square = new Square(10); // 한 변의 길이가 10인 정사각형 생성
  
  // Square 클래스에는 없지만, 부모로부터 물려받은 메소드를 사용합니다.
  console.log(`정사각형의 둘레: ${square.getPerimeter()}`);
  console.log(`정사각형의 넓이: ${square.getArea()}`);
</script>
